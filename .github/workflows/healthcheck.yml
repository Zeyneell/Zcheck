name: Checker health

# Self-healing watchdog: runs `zcheck doctor` on a schedule so the project
# notices when a site changes underneath it. The job fails (and emails you) only
# when a checker becomes "degraded" — i.e. it matched a throwaway canary and
# would have produced a false positive.

on:
  schedule:
    - cron: "17 4 * * *" # nightly, 04:17 UTC
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Refresh datasets
        run: zcheck update || true
      - name: Run doctor (exits non-zero on degraded checkers)
        run: zcheck doctor --json health.json
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health.json
